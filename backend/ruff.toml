line-length = 120
target-version = "py313"
extend-exclude = ["alembic/versions"]  # autogenerated

[lint]
select = ["E", "F", "I", "B", "UP", "RUF100"]
ignore = [
  "B008",  # FastAPI's Depends()/Query() in defaults is the intended pattern
]

[lint.per-file-ignores]
"tests/**" = ["E501", "E731"]  # long fixtures and small lambdas are fine in tests
