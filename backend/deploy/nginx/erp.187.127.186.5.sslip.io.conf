# Annadata 360 ERP web app (vendor portal + admin) on the shared test VPS.
# Installed as /www/server/panel/vhost/nginx/erp.187.127.186.5.sslip.io.conf; proxies to the annadata "web"
# container on 127.0.0.1:3020. Certificate: certbot --webroot -w /www/wwwroot/annadata-acme (renew hook reloads nginx).
server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/erp.187.127.186.5.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.187.127.186.5.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name erp.187.127.186.5.sslip.io;
    location /.well-known/acme-challenge/ { root /www/wwwroot/annadata-acme; }
    if ($scheme = http) { set $redir 1; }
    if ($request_uri ~ ^/.well-known/) { set $redir 0; }
    if ($redir = 1) { return 301 https://$host$request_uri; }
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 15m;  # KYC documents are up to 10 MB
    }
    access_log /www/wwwlogs/erp.187.127.186.5.sslip.io.log;
    error_log /www/wwwlogs/erp.187.127.186.5.sslip.io.error.log;
}
