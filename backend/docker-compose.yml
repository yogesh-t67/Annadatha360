services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: annadata
      POSTGRES_PASSWORD: annadata
      POSTGRES_DB: annadata
    ports:
      - "127.0.0.1:${ANNADATA_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annadata"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env.example
      - path: .env  # local keys/settings, git-ignored; optional
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://annadata:annadata@db:5432/annadata
    ports:
      - "${ANNADATA_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Background jobs (order expiry, mandi price import, housekeeping). Run exactly one.
  scheduler:
    build: .
    command: ["python", "-m", "app.jobs.scheduler"]
    env_file:
      - .env.example
      - path: .env  # local keys/settings, git-ignored; optional
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://annadata:annadata@db:5432/annadata
    depends_on:
      api:
        condition: service_started  # the api container runs migrations on start
    restart: unless-stopped

volumes:
  pgdata:
