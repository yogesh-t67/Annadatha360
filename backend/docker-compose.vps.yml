# Test server (shared VPS): run with
#   docker compose -p annadata -f docker-compose.vps.yml up -d --build
# Kept apart from other projects on the machine: its own project name, network and database volume,
# nothing published to the internet. The host's nginx proxies HTTPS to the API (127.0.0.1:${ANNADATA_API_PORT}) and the
# ERP web app (127.0.0.1:${ANNADATA_WEB_PORT}).
# .env holds the keys plus POSTGRES_PASSWORD (generated on the server, never committed).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: annadata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: annadata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annadata"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env.example
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://annadata:${POSTGRES_PASSWORD}@db:5432/annadata
      TTS_CACHE_DIR: /data/tts
      DOCUMENTS_DIR: /data/documents
      MEDIA_DIR: /data/media
      ERP_WEB_BASE_URL: ${ERP_WEB_BASE_URL:-https://erp.187.127.186.5.sslip.io}  # links in ERP emails
    volumes:
      - tts:/data/tts  # generated voice files survive rebuilds
      - documents:/data/documents  # private KYC files (encrypted)
      - media:/data/media  # public product photos
    ports:
      - "127.0.0.1:${ANNADATA_API_PORT:-8020}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ERP web app (vendor portal + admin). Talks to the API over the project network; nginx proxies HTTPS to it.
  # Gets only the settings it needs, never the backend's secrets.
  web:
    build: ../web
    environment:
      ERP_API_URL: http://api:8000/api/v1
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    ports:
      - "127.0.0.1:${ANNADATA_WEB_PORT:-3020}:3000"
    depends_on:
      - api
    restart: unless-stopped

  # Background jobs (order expiry, mandi price import, housekeeping). Exactly one.
  scheduler:
    build: .
    command: ["python", "-m", "app.jobs.scheduler"]
    env_file:
      - .env.example
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://annadata:${POSTGRES_PASSWORD}@db:5432/annadata
    depends_on:
      api:
        condition: service_started  # the api container runs migrations on start
    restart: unless-stopped

volumes:
  pgdata:
  tts:
  documents:
  media:
